name: office-addin checks
on:
  pull_request:
    paths: ['office-addin/**', 'scripts/**', 'vendor/**', 'versions.yaml', '.github/workflows/office-addin.yml']
  push:
    branches: [main]
    paths: ['office-addin/**', 'scripts/**', 'vendor/**', 'versions.yaml', '.github/workflows/office-addin.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.13.0'
      - run: python3 scripts/check.py office-addin --install --checks typecheck,test,build
        env:
          VITE_ENTRA_CLIENT_ID: 00000000-0000-0000-0000-000000000000
          ADDIN_HOST: https://localhost:3000
      - run: npm run lint --prefix office-addin
      - run: python3 scripts/validate_manifests.py
