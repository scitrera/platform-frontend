name: local-agent checks
on:
  pull_request:
    paths: ['local-agent/**', 'scripts/**', 'vendor/**', 'versions.yaml', '.github/workflows/local-agent.yml']
  push:
    branches: [main]
    paths: ['local-agent/**', 'scripts/**', 'vendor/**', 'versions.yaml', '.github/workflows/local-agent.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.92.0 --profile minimal
      - run: python3 scripts/check.py local-agent
